<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- ZekoulABia — symbole : deux pages/feuilles qui s'élèvent depuis un point commun,
       le savoir qui germe, surmonté d'une étincelle -->

  <!-- Pétale droit -->
  <path d="M100,150
           C138,148 158,110 155,68
           C152,45 138,40 128,48
           C108,64 96,110 100,150 Z"
        fill="#1a2e1e"/>

  <!-- Pétale gauche -->
  <path d="M100,150
           C62,148 42,110 45,68
           C48,45 62,40 72,48
           C92,64 104,110 100,150 Z"
        fill="#059669"/>

  <!-- Fine ligne de séparation centrale, pour lisibilité à petite taille -->
  <path d="M100,150 C97,120 97,80 100,52" stroke="#f7f3ee" stroke-width="2.5" fill="none" opacity="0.35"/>

  <!-- Tige -->
  <path d="M100,150 L100,168" stroke="#1a2e1e" stroke-width="5" stroke-linecap="round"/>

  <!-- Étincelle de savoir -->
  <circle cx="100" cy="34" r="8.5" fill="#f4c475"/>
</svg>
